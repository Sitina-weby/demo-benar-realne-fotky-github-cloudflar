# Claude Code on the Claude subscription — JARVIS hands work over by mentioning @claude in an issue.
name: Claude
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      allowed: ${{ steps.trigger.outputs.allowed }}
    steps:
      - uses: actions/github-script@v7
        id: trigger
        with:
          script: |
            const target = context.eventName === 'issues' ? context.payload.issue : context.payload.comment;
            const association = target?.author_association || 'UNKNOWN';
            const mention = typeof target?.body === 'string' && target.body.includes('@claude');
            let permission = 'unknown', permissionStatus = null;
            try { const r = await github.rest.repos.getCollaboratorPermissionLevel({...context.repo, username:target.user.login}); permission=r.data.permission; }
            catch(e) { permissionStatus=e.status || null; }
            const allowed = ['admin','maintain','write'].includes(permission) && mention;
            const marker = /<!-- jarvis-job:([A-Za-z0-9_-]{1,80}) -->/.exec(context.payload.issue?.body || '');
            const info = {repo: context.repo.owner + '/' + context.repo.repo, issue: context.payload.issue?.number || null,
              jobId: marker?.[1] || null, event: context.eventName, action: context.payload.action,
              authorAssociation: association, repositoryPermission:permission, permissionStatus, hasMention: mention, allowed,
              reason: !mention ? 'NO_CLAUDE_MENTION' : !allowed ? permission === 'unknown' ? 'PERMISSION_UNVERIFIED' : 'REPOSITORY_WRITE_PERMISSION_REQUIRED' : 'READY'};
            core.notice(JSON.stringify(info), {title:'JARVIS trigger'});
            core.setOutput('allowed', String(allowed));
  claude:
    needs: diagnostics
    if: ${{ needs.diagnostics.outputs.allowed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --allowedTools "Edit,Write,Read,Glob,Grep,WebFetch,WebSearch,Bash(npm ci),Bash(npm install:*),Bash(npm run:*),Bash(npm test:*),Bash(npm ls:*),Bash(npx astro:*),Bash(npx vite:*),Bash(npx playwright:*),Bash(npx prettier:*),Bash(npx eslint:*),Bash(node:*),Bash(git:*),Bash(ls:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(mkdir:*),Bash(cp:*),Bash(mv:*),Bash(rm:*),Bash(find:*),Bash(grep:*),Bash(sed:*),Bash(cwebp:*),Bash(convert:*),Bash(gh pr create:*),Bash(gh pr view:*)"
